[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.gd",
  "php83Extensions.zip",
  "php83Extensions.pdo_mysql",
  "nodejs_20"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan config:clear && php artisan serve --host=0.0.0.0 --port=$PORT"